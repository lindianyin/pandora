syntax = "proto3";
package pandora;

message BijiDun {
  repeated int32 cards = 1;  // 3 CardId
  int32 type = 2;
  int32 place = 3;
  int64 delta = 4;
}

message BijiSeatCompare {
  int32 seat_id = 1;
  int64 uid = 2;
  BijiDun head = 3;
  BijiDun mid = 4;
  BijiDun tail = 5;
}

message BijiChixi {
  int32 type = 1;
  int32 mult = 2;
}

message BijiSeatSettle {
  int32 seat_id = 1;
  int64 uid = 2;
  int64 dun_delta_head = 3;
  int64 dun_delta_mid = 4;
  int64 dun_delta_tail = 5;
  int64 chixi_delta = 6;
  int64 gross = 7;
  int64 rake = 8;
  int64 net = 9;
  int64 gold = 10;
  repeated BijiChixi chixi = 11;
}

// msg_id = 600001
message S2C_BijiGameStart {
  int64 round_id = 1;
  int64 room_id = 2;
  int32 template_id = 3;
  int32 self_seat = 4;
  int32 players = 5;
  int32 deal_start = 6;
  int32 base_score = 7;
  int32 arrange_timeout_s = 8;
  repeated int32 hand = 9;
  bool enable_chixi = 10;
}

// msg_id = 600002
message S2C_BijiArrangeState {
  repeated bool locked = 1;
  repeated bool trusteeship = 2;
  int32 remain_s = 3;
}

// msg_id = 600003
message C2S_BijiArrange {
  repeated int32 head = 1;
  repeated int32 mid = 2;
  repeated int32 tail = 3;
  bool confirm = 4;
}

// msg_id = 600004
message S2C_BijiArrangeAck {
  int32 code = 1;
  string message = 2;
  bool locked = 3;
}

// msg_id = 600005
message S2C_BijiCompare {
  int64 round_id = 1;
  repeated BijiSeatCompare seats = 2;
}

// msg_id = 600006
message S2C_BijiSettle {
  int64 round_id = 1;
  repeated BijiSeatSettle seats = 2;
}

// msg_id = 600007
message S2C_BijiSnapshot {
  int32 phase = 1;  // 0 WaitReady 1 Deal 2 Arrange 3 Compare 4 Settle
  int32 deal_start = 2;
  int32 remain_s = 3;
  repeated int32 hand = 4;
  repeated int32 draft_head = 5;
  repeated int32 draft_mid = 6;
  repeated int32 draft_tail = 7;
  bool has_draft = 8;
  bool locked = 9;
  repeated bool others_locked = 10;
  S2C_BijiCompare compare = 11;
  S2C_BijiSettle settle = 12;
}
