syntax = "proto3";
package pandora;

// msg_id = 300001
message S2C_HzmjGameStart {
  int64 round_id = 1;
  int64 room_id = 2;
  int32 template_id = 3;
  int32 banker_seat = 4;
  int32 lian_zhuang = 5;
  int32 N = 6;
  repeated int32 caishen_tiles = 7;
  repeated int32 self_hand = 8;
  int32 wall_remain = 9;
  optional int32 self_seat = 10;  // optional: proto3 would omit 0 otherwise
  int32 base_score = 11;
}

// msg_id = 300002
message S2C_HzmjTurn {
  optional int32 seat_id = 1;  // optional so seat 0 is present on wire
  string sub = 2;  // discard|claim|piao
  int32 timeout_s = 3;
  int32 wall_remain = 4;
  int32 piao_seat = 5;
  repeated int32 self_hand = 6;  // 仅发给需要出牌/操作的玩家，权威手牌纠偏
  bool can_zimo = 7;  // 本回合可自摸：摸牌后或庄家起手；吃碰后为 false
}

// msg_id = 300003
message S2C_HzmjDraw {
  int32 seat_id = 1;
  int32 tile = 2;  // -1 if not self
}

// msg_id = 300005
message C2S_HzmjDiscard {
  int32 tile = 1;
}

// msg_id = 300006
message S2C_HzmjDiscardBroadcast {
  optional int32 seat_id = 1;
  int32 tile = 2;
}

// msg_id = 300007
message C2S_HzmjAction {
  int32 action = 1;  // 0 pass 1 chi 2 peng 3 gang 4 hu
  repeated int32 chi_hand_tiles = 2;
}

// msg_id = 300008
message S2C_HzmjActionBroadcast {
  int32 seat_id = 1;
  int32 action = 2;  // 1 chi 2 peng 3 gang(明/暗/补)
  int32 tile = 3;
  repeated int32 tiles = 4;  // 副露完整牌面（吃为三张有序；碰三；杠四）
  optional int32 from_seat = 5;
  int32 meld_kind = 6;  // 1 chi 2 peng 3 ming_gang 4 an_gang 5 bu_gang；0=兼容旧包
}

// msg_id = 300009
message S2C_HzmjSettle {
  message Entry {
    int64 uid = 1;
    int32 seat_id = 2;
    int64 delta_gold = 3;
  }
  int64 round_id = 1;
  int32 winner_seat = 2;
  int32 hu_tile = 3;
  bool is_zimo = 4;
  int32 shooter_seat = 5;
  int32 M = 6;
  int32 N = 7;
  int32 contractor_seat = 8;
  int32 base_score = 9;
  repeated Entry entries = 10;
}

// msg_id = 300010
message S2C_HzmjLiuJu {
  int32 lian_zhuang = 1;
}

// msg_id = 300011
message C2S_HzmjGang {
  int32 kind = 1;  // 0 an 1 bu
  int32 tile = 2;
}
