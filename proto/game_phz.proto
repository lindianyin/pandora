syntax = "proto3";
package pandora;

// msg_id = 400001
message S2C_PhzGameStart {
  int64 round_id = 1;
  int64 room_id = 2;
  int32 template_id = 3;
  int32 banker_seat = 4;
  repeated int32 self_hand = 5;
  int32 wall_remain = 6;
  optional int32 self_seat = 7;
  int32 base_score = 8;
  string cfg_snapshot = 9;  // JSON subset of PhzConfig
}

// msg_id = 400002
message S2C_PhzTurn {
  optional int32 seat_id = 1;
  string sub = 2;  // discard|claim|draw_judge
  int32 timeout_s = 3;
  int32 wall_remain = 4;
  repeated int32 self_hand = 5;
  bool can_hu = 6;
}

// msg_id = 400003
message S2C_PhzDraw {
  int32 seat_id = 1;
  int32 tile = 2;  // -1 if not self (pre-reveal)
}

// msg_id = 400004
message S2C_PhzReveal {
  optional int32 seat_id = 1;
  int32 tile = 2;
}

// msg_id = 400005
message C2S_PhzDiscard {
  int32 tile = 1;
}

// msg_id = 400006
message S2C_PhzDiscardBroadcast {
  optional int32 seat_id = 1;
  int32 tile = 2;
}

// msg_id = 400007
message C2S_PhzAction {
  int32 action = 1;  // 0 pass 1 chi 2 peng 4 hu
  repeated int32 chi_hand_tiles = 2;
}

// msg_id = 400008
message S2C_PhzActionBroadcast {
  int32 seat_id = 1;
  int32 action = 2;
  int32 tile = 3;
  repeated int32 tiles = 4;
  optional int32 from_seat = 5;
  int32 meld_kind = 6;  // 1 chi 2 peng 3 wei 4 chou_wei 5 pao 6 ti 7 jiao
}

// msg_id = 400009
message S2C_PhzSettle {
  message Entry {
    int64 uid = 1;
    int32 seat_id = 2;
    int64 delta_gold = 3;
  }
  int64 round_id = 1;
  int32 winner_seat = 2;
  int32 hu_tile = 3;
  bool is_draw_win = 4;
  int32 hu_xi = 5;
  int32 tun = 6;
  int32 fan = 7;
  int32 ming_tang_mask = 8;
  int32 base_score = 9;
  repeated Entry entries = 10;
}

// msg_id = 400010
message S2C_PhzLiuJu {
  int32 banker_seat = 1;
}
